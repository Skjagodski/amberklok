(()=>{'use strict';
const nl=["HETXISXVIJFX", "TIENXKWARTXX", "VOORXOVERXXX", "HALFXEENXXXX", "TWEEXDRIEXXX", "VIERXVIJFXXX", "ZEVENXACHTXX", "NEGENXTIENXX", "ELFXTWAALFXX", "ZESXUURXXXXX"], zh=["现在是整〇〇〇〇〇〇〇〇", "一点二点三点四点五点六点", "七点八点九点十点〇〇〇〇", "十一点十二点〇〇〇〇〇〇", "五分十分十五分二十分〇", "二十五分三十分三十五分", "四十分四十五分五十分〇", "五十五分〇〇〇〇〇〇〇〇"];
const $=id=>document.getElementById(id), nlEl=document.querySelector('.board.nl'),zhEl=document.querySelector('.board.zh');
document.querySelectorAll('.board.zh .line').forEach((el,i)=>el.style.setProperty('--cols',zh[i].length));
const syllables={'现':'xiàn','在':'zài','是':'shì','整':'zhěng','〇':'·','一':'yī','二':'èr','三':'sān','四':'sì','五':'wǔ','六':'liù','七':'qī','八':'bā','九':'jiǔ','十':'shí','点':'diǎn','分':'fēn'};
const pyEl=zhEl.cloneNode(true);
pyEl.classList.replace('zh','py');
pyEl.classList.add('zh');
pyEl.lang='zh-Latn';
pyEl.querySelectorAll('.letter').forEach(el=>{el.textContent=syllables[el.textContent]});
zhEl.after(pyEl);
for(const board of [zhEl,pyEl]){
 const label=document.createElement('div');
 label.className='daypart';
 board.prepend(label);
}
for(const board of [nlEl,zhEl,pyEl]){
 const row=board.querySelector('.line:last-child');
 [...row.children].slice(9).forEach(el=>{el.style.visibility='hidden'});
 const version=document.createElement('span');
 version.className='version';
 version.textContent='v2.4';
 row.append(version);
}
let language='nl',flip=false,last='';
function daypart(hour){
 if(hour<6)return ['凌晨','língchén'];
 if(hour<12)return ['上午','shàngwǔ'];
 if(hour<13)return ['中午','zhōngwǔ'];
 if(hour<18)return ['下午','xiàwǔ'];
 return ['晚上','wǎnshang'];
}
function pinyinNumber(n){
 const digits=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];
 if(n<10)return digits[n];
 return (n<20?'':digits[Math.floor(n/10)]+' ')+'shí'+(n%10?' '+digits[n%10]:'');
}
function pinyinDate(d){
 const weekdays=['rì','yī','èr','sān','sì','wǔ','liù'];
 return pinyinNumber(d.getMonth()+1)+' yuè '+pinyinNumber(d.getDate())+' rì · xīngqī '+weekdays[d.getDay()];
}
function light(board,positions){board.querySelectorAll('.line').forEach((line,y)=>{Array.from(line.children).forEach((el,x)=>el.classList.toggle('on',positions.some(p=>p[0]===y&&x>=p[1]&&x<p[1]+p[2])))})}
function word(rs,y,w,occ=0){let at=-1,start=0;for(let i=0;i<=occ;i++){at=rs[y].indexOf(w,start);if(at<0)return null;start=at+w.length}return [y,at,w.length]}
function draw(){const d=new Date(),m=d.getMinutes(),hour=d.getHours();language=$('lang').value==='auto'?['nl','zh','py'][m%3]:$('lang').value;const key=d.toDateString()+hour+':'+m+language+flip;if(key===last)return;last=key;
const period=daypart(hour);
zhEl.querySelector('.daypart').textContent=period[0];
pyEl.querySelector('.daypart').textContent=period[1];
nlEl.classList.toggle('hidden',language!=='nl');
zhEl.classList.toggle('hidden',language!=='zh');
pyEl.classList.toggle('hidden',language!=='py');
document.documentElement.lang=language==='py'?'zh-Latn':language==='zh'?'zh-Hans':'nl';
const step=Math.floor(m/5),h=((hour+(step>=4?1:0))%12)||12;
const hrs={1:[3,'EEN'],2:[4,'TWEE'],3:[4,'DRIE'],4:[5,'VIER'],5:[5,'VIJF'],6:[9,'ZES'],7:[6,'ZEVEN'],8:[6,'ACHT'],9:[7,'NEGEN'],10:[7,'TIEN'],11:[8,'ELF'],12:[8,'TWAALF']};
const p=[word(nl,0,'HET'),word(nl,0,'IS'),word(nl,...hrs[h])];
const add=(y,w)=>p.push(word(nl,y,w));
if(step===0)add(9,'UUR');if(step===1||step===5||step===7||step===11)add(0,'VIJF');
if([2,4,8,10].includes(step))add(1,'TIEN');if([3,9].includes(step))add(1,'KWART');
if([1,2,3,7,8].includes(step))add(2,'OVER');if([4,5,9,10,11].includes(step))add(2,'VOOR');if([4,5,6,7,8].includes(step))add(3,'HALF');
light(nlEl,p.filter(Boolean));
const zhp={1:[1,'一点'],2:[1,'二点'],3:[1,'三点'],4:[1,'四点'],5:[1,'五点'],6:[1,'六点'],7:[2,'七点'],8:[2,'八点'],9:[2,'九点'],10:[2,'十点'],11:[3,'十一点'],12:[3,'十二点']};
const zmp={0:[0,'整'],5:[4,'五分'],10:[4,'十分'],15:[4,'十五分'],20:[4,'二十分'],25:[5,'二十五分'],30:[5,'三十分'],35:[5,'三十五分'],40:[6,'四十分'],45:[6,'四十五分'],50:[6,'五十分'],55:[7,'五十五分']};
const zhour=d.getHours()%12||12,zm=Math.floor(m/5)*5;
const positions=[word(zh,0,'现在是'),word(zh,...zhp[zhour]),word(zh,...zmp[zm])].filter(Boolean);
light(zhEl,positions);light(pyEl,positions);
$('dots').textContent='●'.repeat(m%5)+'○'.repeat(4-m%5);
const date=language==='py'?pinyinDate(d):language==='nl'?new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(d).toUpperCase():new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);
$('wordDate').textContent=date;$('flipDate').textContent=date;
const digits=String(d.getHours()).padStart(2,'0')+String(m).padStart(2,'0');document.querySelectorAll('.digit').forEach((el,i)=>{if(el.textContent!==digits[i])el.textContent=digits[i]});}
$('lang').addEventListener('change',()=>{last='';draw()});
function setMode(f){flip=f;$('wordClock').classList.toggle('hidden',f);$('flipClock').classList.toggle('hidden',!f);$('words').setAttribute('aria-pressed',String(!f));$('flips').setAttribute('aria-pressed',String(f));last='';draw()}
$('words').addEventListener('click',()=>setMode(false));$('flips').addEventListener('click',()=>setMode(true));draw();setInterval(draw,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){last='';draw()}});
})();</script></body></html>
